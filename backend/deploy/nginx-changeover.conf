# 转产测试追溯 CRT · Nginx 配置（方案 B：Nginx 托管前端 dist，反代 /api）
#
# 适用：内网服务器正式态，且服务器上已有/允许安装 Nginx。
# 若不想装 Nginx，可用方案 A（后端单端口托管前端，免此文件）：
#   仅设置 backend/.env 的 FRONTEND_DIST=/opt/changeover/frontend/dist 即可。
#
# 部署：sudo cp deploy/nginx-changeover.conf /etc/nginx/conf.d/changeover.conf
#       sudo nginx -t && sudo systemctl reload nginx

upstream changeover_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen       80;
    server_name  changeover.local;          # ← 改成实际域名；留 _ 表示任意 Host

    # 前端构建产物
    root  /opt/changeover/frontend/dist;
    index index.html;

    # 照片上传（前端已压缩，留足余量）
    client_max_body_size 20m;

    access_log /var/log/nginx/changeover.access.log;
    error_log  /var/log/nginx/changeover.error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 带 hash 的静态资源可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 前端 history 路由：未命中的路径一律回 index.html
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    # 后端接口
    location /api/ {
        proxy_pass         http://changeover_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;            # WB 查询/归档可能较慢
        proxy_send_timeout 120s;
    }

    # 健康检查（给负载/监控用）
    location = /health {
        proxy_pass http://changeover_backend/api/health;
        access_log off;
    }
}
